services:
  - type: web
    name: avengers-assemble-api
    runtime: rust
    plan: free
    buildCommand: cargo build --release
    startCommand: ./target/release/server
    envVars:
      - key: STAGE
        value: Production
      - key: SERVER_BODY_LIMIT
        value: 10
      - key: SERVER_TIMEOUT
        value: 90
      - key: MAX_CREW_PER_MISSION
        value: 10
      - key: JWT_LIFE_TIME_DAYS
        value: 7
      - key: JWT_TTL
        value: 7
      # Set these manually in the Render dashboard (Environment tab):
      # DATABASE_URL  — from Supabase: Project Settings > Database > Connection string (URI)
      #                 append ?sslmode=require if not already included
      # JWT_USER_SECRET, JWT_USER_REFRESH_SECRET
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
      - key: DATABASE_URL
        sync: false
      - key: JWT_USER_SECRET
        sync: false
      - key: JWT_USER_REFRESH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
