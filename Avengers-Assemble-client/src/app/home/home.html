<div
    class="container h-full flex flex-col content-center bg-[#111111] justify-center text-xl rounded-b-xl min-h-screen">
    <div class="flex content-center justify-center self-center gap-5">
        <span class="font-bold text-6xl text-white">HI</span>
        <span class="typewriter text-4xl text-[#3b3b3b] self-center">
            This is AvengerAssemble!
        </span>
    </div>
    <div (click)="handleClick()"
        class="show-more-button mt-40 bg-white h-10 rounded-xl w-40 flex self-center justify-center font-semibold text-black items-center cursor-pointer hover:bg-gray-200 transition-colors">
        <span>Show more</span>
    </div>
</div>

<div id="About-section" class=" py-20 px-10 ">
    <div class="max-w-6xl mx-auto space-y-12">
        <div class="text-center space-y-4">
            <h1 class="text-5xl font-bold text-blue-500">Tactical Assemble</h1>
            <p class="text-xl text-black max-w-2xl mx-auto">
                Coordinate your crew.
            </p>
        </div>

    </div>
</div>

<div class=" py-20 px-10">
    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
        <div >
            <h3 class="text-3xl font-bold text-blue-600  mb-4">Let's Feedback</h3>
            <p class="text-black mb-6">
                Have verified feedback or need to report an issue? 
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-md hover:border-white hover:border">
            <form #contactFormRef="ngForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
                <div class="space-y-1">
                    <label class="text-sm font-semibold text-black">Name</label>
                    <input type="text" name="name" [(ngModel)]="contactForm.name" placeholder="Your Name" required
                        class="w-full p-3 rounded-lg border border-black bg-gray-100 placeholder-gray-500" />
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-semibold text-black">Email</label>
                    <input type="email" name="email" [(ngModel)]="contactForm.email" placeholder="your@email.com"
                        required
                        class="w-full p-3 rounded-lg border border-black bg-gray-100 placeholder-gray-500" />
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-semibold text-black">Message</label>
                    <textarea name="message" [(ngModel)]="contactForm.message" placeholder="What's on your mind?"
                        rows="3"
                        class="w-full p-3 rounded-lg border border-black bg-gray-100 resize-none placeholder-gray-500"></textarea>
                </div>

                <button type="submit" [disabled]="loading"
                    class="mt-2 bg-[#1a1a1a] text-white py-3 px-6 rounded-lg font-medium flex items-center justify-center gap-2 hover:bg-gray-200 active:scale-95 transition-all disabled:opacity-70 disabled:cursor-not-allowed w-full">
                    <span *ngIf="loading">Sending...</span>
                    <span *ngIf="!loading">Send Message</span>
                </button>
            </form>
        </div>
    </div>
</div>
