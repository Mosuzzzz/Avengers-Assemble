<div class="min-h-screen bg-black flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">

        <h1 class="text-9xl font-bold text-white mb-4">404</h1>


        <h2 class="text-2xl font-semibold text-white mb-4">Page Not Found</h2>


        <p class="text-gray-400 mb-8">
            The page you are looking for doesn't exist or has been moved.
        </p>


        <button (click)="goBack()"
            class="bg-white text-black px-8 py-3 rounded-lg font-semibold hover:bg-gray-200 transition-colors">
            Go Back
        </button>
    </div>
</div>
