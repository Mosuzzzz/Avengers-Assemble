<h2 mat-dialog-title>Upload Image</h2>
<mat-dialog-content>
    <div class="content-container">
        @if (imgPreview()) {
        <img [src]="imgPreview()" alt="upload image">
        }
        @if (imgFile) {
        <p>{{imgFile.name}}</p>
        }
        @if (errorMsg()) {
        <p class="error-msg">{{errorMsg()}}</p>
        }
    </div>
    <input type="file" #filePicker (change)="onImagePicked($event)" accept=".jpg">
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton (click)="onSubmit()" [disabled]="!imgFile">Upload</button>
</mat-dialog-actions>
