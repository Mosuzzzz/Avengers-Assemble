<div class="p-8 w-[450px] bg-white rounded-3xl font-sans">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Search Operations</h2>
        <button (click)="close()" class="text-slate-400 hover:text-black transition-colors">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <div class="relative group mb-8">
        <mat-icon
            class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-black transition-colors">
            search
        </mat-icon>
        <input type="text" [(ngModel)]="searchTerm" (keyup.enter)="search()" autofocus
            placeholder="Type mission name..."
            class="w-full pl-14 pr-6 py-5 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-black transition-all outline-none text-lg text-slate-700 placeholder:text-slate-400 font-medium font-sans">
    </div>

    <div class="flex gap-4">
        <button (click)="searchTerm.set(''); search()"
            class="flex-1 py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition-all">
            Clear Search
        </button>
        <button (click)="search()"
            class="flex-[2] py-4 bg-black text-white rounded-2xl font-bold shadow-lg hover:bg-slate-800 transition-all active:scale-95">
            Search Now
        </button>
    </div>
</div>
