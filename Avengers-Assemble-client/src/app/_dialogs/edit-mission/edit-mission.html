<div class="flex flex-col gap-2 bg-white">
    <h4 mat-dialog-title>Edit Mission</h4>
    <mat-dialog-content>
        <div style="display: flex; flex-direction: column; gap: 1rem; padding-top: 1rem;">
            <input type="text" [(ngModel)]="editMission.name" placeholder="Mission Name"
            style="padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;" />
            <textarea [(ngModel)]="editMission.description" placeholder="Mission Description"
            class="p-2 border-[#ccc] border rounded-sm h-24 min-h-24 max-h-24"></textarea>
        </div>
        
        <mat-dialog-actions>
            <button (click)="onSubmit()" color="primary" [disabled]="!editMission.name"
            class="bg-black text-white p-2 rounded-md cursor-pointer hover:bg-gray-400"
            >
            Save Changes</button>
        </mat-dialog-actions>
    </mat-dialog-content>
</div>
