<div class="mission-dialog-container font-sans bg-white overflow-hidden">
    <!-- Dialog Header -->
    <div class="px-8 py-6 bg-gray-900 border-b border-white/10 flex items-center justify-between">
        <div class="flex flex-col">
            <h2 class="text-white text-2xl font-black uppercase italic tracking-tight leading-none">New Mission</h2>
            <span class="text-red-500 text-[10px] font-bold uppercase tracking-[0.2em] mt-1">Initiating Operation</span>
        </div>
        <div class="w-12 h-12 bg-white/5 border border-white/10 rounded-xl flex items-center justify-center">
            <mat-icon class="text-white scale-125">add_task</mat-icon>
        </div>
    </div>

    <!-- Dialog Content -->
    <mat-dialog-content class="!p-0 !m-0">
        <div class="flex flex-col gap-6 p-8">
            <!-- Name Input -->
            <div class="group flex flex-col gap-1.5">
                <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest pl-1 leading-none">Mission
                    Codename</label>
                <div
                    class="flex items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 group-focus-within:border-black group-focus-within:bg-white transition-all">
                    <mat-icon class="text-gray-400 mr-3 scale-90">label</mat-icon>
                    <input type="text" [(ngModel)]="addMission.name" placeholder="Enter mission name..."
                        class="bg-transparent border-none outline-none w-full text-sm font-bold text-gray-900 placeholder:text-gray-400 placeholder:font-medium" />
                </div>
            </div>

            <!-- Description Input -->
            <div class="group flex flex-col gap-1.5">
                <label
                    class="text-[10px] font-black text-gray-500 uppercase tracking-widest pl-1 leading-none">Operational
                    Briefing</label>
                <div
                    class="flex flex-col bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 group-focus-within:border-black group-focus-within:bg-white transition-all">
                    <textarea [(ngModel)]="addMission.description" placeholder="Describe the mission objectives..."
                        class="bg-transparent border-none outline-none w-full text-sm font-medium text-gray-700 min-h-[100px] max-h-[100px] placeholder:text-gray-400"></textarea>
                </div>
            </div>

            <!-- Password & Max Crew Row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Password -->
                <div class="group flex flex-col gap-1.5">
                    <label
                        class="text-[10px] font-black text-gray-500 uppercase tracking-widest pl-1 leading-none">Access
                        Protocol (Optional)</label>
                    <div
                        class="flex items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 group-focus-within:border-black group-focus-within:bg-white transition-all">
                        <mat-icon class="text-gray-400 mr-3 scale-90">lock</mat-icon>
                        <input type="password" [(ngModel)]="addMission.password" placeholder="Passphrase..."
                            class="bg-transparent border-none outline-none w-full text-sm font-bold text-gray-900 placeholder:text-gray-400 placeholder:font-medium" />
                    </div>
                </div>

                <!-- Max Crew -->
                <div class="group flex flex-col gap-1.5">
                    <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest pl-1 leading-none">Team
                        Capacity</label>
                    <div
                        class="flex items-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 group-focus-within:border-black group-focus-within:bg-white transition-all">
                        <mat-icon class="text-gray-400 mr-3 scale-90">groups</mat-icon>
                        <input type="number" [(ngModel)]="addMission.max_crew" placeholder="Max Crew" min="1" max="20"
                            class="bg-transparent border-none outline-none w-full text-sm font-bold text-gray-900 placeholder:text-gray-400 placeholder:font-medium" />
                    </div>
                </div>
            </div>
        </div>
    </mat-dialog-content>

    <!-- Dialog Actions -->
    <div class="bg-gray-50 p-6 px-8 flex justify-end items-center gap-4">
        <button mat-dialog-close
            class="text-[11px] font-black uppercase text-gray-400 hover:text-red-600 transition-colors tracking-widest mr-4">
            Cancel
        </button>
        <button (click)="onSubmit()" [disabled]="!addMission.name"
            class="bg-black text-white px-8 py-3.5 rounded-xl font-black text-[11px] uppercase tracking-[0.2em] hover:bg-gray-800 disabled:opacity-30 disabled:hover:bg-black transition-all flex items-center gap-2 group/btn shadow-xl shadow-black/5 active:scale-95">
            <span>Deploy Mission</span>
            <mat-icon class="scale-75 group-hover:translate-x-1 transition-transform">send</mat-icon>
        </button>
    </div>
</div>
