<mat-toolbar class="my-navbar" color="primary">
  <span routerLink="/" class="cursor-pointer">The Avengers Assemble</span>
  <span class="spacer"></span>

  @if (accountService.user()) {
  <div class="user-profile-trigger cursor-pointer" [matMenuTriggerFor]="menu">
    @if(accountService.user()?.avatar_url) {
      <img [src]="accountService.user()?.avatar_url" class="w-20 h-20 border-2 border-white rounded-full">
    } @else {
      <img src="assets/default.avatar.jpg" class="w-20 h-20 border-2 border-white rounded-full">
    }
    <span class="ml-2 font-medium">{{ accountService.user()?.display_name || accountService.user()?.username }}</span>
    <mat-icon>expand_more</mat-icon>
  </div>

  <mat-menu #menu="matMenu">
    <button mat-menu-item routerLink="/profile">Profile</button>
    <button mat-menu-item (click)="logout()">Logout</button>
  </mat-menu>

  } @else {
  <button mat-button routerLink="/login" routerLinkActive="active">Login</button>
  }
</mat-toolbar>
