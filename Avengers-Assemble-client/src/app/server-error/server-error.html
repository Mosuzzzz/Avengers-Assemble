<div class="container mt-32 p-32 font-sans">
    <div
        class="tap-row flex justify-between items-start border-b-2 rounded-md p-6 shadow-[0_6px_10px_-8px_rgba(0,0,0,0.12)] bg-gray-50">
        <div class="flex flex-col">
            <span class="text-4xl font-semibold tracking-tight text-red-600 uppercase">Server Error</span>
            <span class="text-gray-500">The Helicarrier has encountered an anomaly</span>
        </div>
    </div>

    <div class="flex justify-center mt-12">
        <div
            class="card-item flex flex-col p-12 max-w-2xl w-full rounded-md shadow-md bg-white gap-6 border-t-4 border-red-500">
            <div class="flex flex-col gap-2">
                <h1 class="text-2xl font-bold text-gray-900">Operational Failure</h1>
                <p class="text-gray-600">
                    Jarvis reported an internal processing error. Please check the transmission payload below or return
                    to the command center.
                </p>
            </div>

            @if (errorMsg) {
            <div class="bg-gray-50 p-6 rounded border border-gray-200">
                <span class="text-[10px] font-black uppercase text-gray-400 tracking-widest block mb-2">Error
                    Data</span>
                <code class="text-sm text-red-700 break-all font-mono">{{errorMsg}}</code>
            </div>
            }

            <div class="mt-2">
                <button (click)="goHome()"
                    class="bg-black text-white p-3 px-8 rounded-md font-semibold hover:bg-gray-800 transition-all active:scale-95 shadow-md">
                    Back to Command Center
                </button>
            </div>

            <div class="pt-4 border-t border-gray-100 mt-2">
                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em]">Security Level: Level 7
                    Alpha</span>
            </div>
        </div>
    </div>
</div>
