<div class="min-h-screen bg-black flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">

        <h1 class="text-9xl font-bold text-white mb-4">500</h1>


        <h2 class="text-2xl font-semibold text-white mb-4">Server Error</h2>


        <p class="text-gray-400 mb-8">
            The server encountered an unexpected error and couldn't complete your request.
        </p>


        @if (errorMsg) {
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 mb-8 text-left">
            <p class="text-sm text-gray-400 font-mono break-words">{{ errorMsg }}</p>
        </div>
        }


        <button (click)="goBack()"
            class="bg-white text-black px-8 py-3 rounded-lg font-semibold hover:bg-gray-200 transition-colors">
            Go Back
        </button>
    </div>
</div>
